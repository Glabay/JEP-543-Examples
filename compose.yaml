name: midnight-dashboard

services:
  postgres:
    image: postgres:18-alpine
    container_name: midnight-dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-midnight_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-midnight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-midnight-local-only}
    ports:
      - "6942:5432"
    volumes:
      - midnight-dashboard-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-midnight} -d ${POSTGRES_DB:-midnight_dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  midnight-dashboard-postgres-data:

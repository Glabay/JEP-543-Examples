spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: midnight-dashboard
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:6942/midnight_dashboard}
    username: ${DB_USERNAME:midnight}
    password: ${DB_PASSWORD:midnight-local-only}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

logging:
  level:
    root: INFO
    dev.midnightcoder.midnightdashboard: INFO
    org.springframework.jdbc: WARN
